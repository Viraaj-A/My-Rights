services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: myrights
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: raw_data_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myrights -d raw_data_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1500m

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SQLALCHEMY_DATABASE_URI: postgresql://myrights:${POSTGRES_PASSWORD}@db:5432/raw_data_db
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    mem_limit: 2200m
    volumes:
      - ./gunicorn_hetzner.py:/app/gunicorn_hetzner.py:ro
    command: gunicorn -c gunicorn_hetzner.py app:app

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
